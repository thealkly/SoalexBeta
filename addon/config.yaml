name: Soalex
version: "0.1.188"
# Minimum HA Core version — inkompatible Versionen erhalten Install-Warning im Add-on-Store.
homeassistant: "2026.4.0"
slug: soalex
description: >-
  Sekundengenaue aktive Nulleinspeisung und Akku-Pool-Steuerung
  für Home Assistant. Regelt 100% lokal, kein Cloud-Zwang, sendet nie von selbst.
  Ein Alex Kly Produkt.
url: https://github.com/thealkly/SoalexBeta
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
panel_icon: mdi:solar-power-variant
panel_title: Soalex
ingress: true
ingress_port: 8777
hassio_api: true
hassio_role: default
homeassistant_api: true
# No external port exposure — HA Ingress is the only access path (AC 7, NFR28).
ports: {}
ports_description: {}
# /data/ is auto-mounted by the HA Supervisor — do NOT declare it in `map`.
map: []
# BUG-0131 (Fix-Plan 2026-09-29, Paket S6) — the HA add-on backup copies all
# of /data. Rotating logs (up to 5 x 10 MB) and the diag-export scratch copies
# (a full VACUUM-INTO DB per export, swept after 6 h) are pure bloat there and
# made backups of busy installs slow or fail (pepsipeter, 22.09.). Patterns
# are relative to /data. The DB itself (soalex.db + WAL) stays in the backup.
backup_exclude:
  - "logs/*"
  - ".diag/*"
# Add-on options. Descriptions live in `translations/<lang>.yaml`
# (HA Supervisor convention for option-field labels).
schema:
  log_level: list(debug|info|warning|error)
options:
  log_level: info
image: ghcr.io/thealkly/soalexbeta-{arch}
